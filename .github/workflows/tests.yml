name: Public CPU unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install .
      # Full integration coverage also needs pinned vendor source and private
      # archive fixtures. This job deliberately reports only the portable suite.
      - name: Run public CPU tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            test_protocol.py \
            test_benchmark.py \
            test_pipeline.py \
            test_interventions.py \
            test_fixed_response.py \
            test_decision_diagnostic.py \
            test_statistical_validation.py; do
            python -m unittest discover -s tests -p "$test_file" -v
          done
