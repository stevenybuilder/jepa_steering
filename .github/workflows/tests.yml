name: Public CPU unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install '.[analysis,test]'
      - name: Check published result consistency
        run: |
          python scripts/check_public_results.py
          python scripts/check_manuscript.py
      # Full integration coverage also needs pinned vendor source and private
      # archive fixtures. This job deliberately reports only the portable suite.
      - name: Run public CPU tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            test_protocol.py \
            test_benchmark.py \
            test_pipeline.py \
            test_interventions.py \
            test_fixed_response.py \
            test_decision_diagnostic.py \
            test_statistical_validation.py \
            test_fresh_confirmation.py \
            test_fresh_engineering.py \
            test_mechanism_energy_schema.py \
            test_candidate_score_trace.py \
            test_layer_attention_pilot.py \
            test_steering_specificity.py \
            test_decision_geometry.py \
            test_pathway_geometry.py \
            test_candidate_replay_pilot.py \
            test_pilot_summary.py \
            test_cem_steering_summary.py \
            test_steered_cem_pilot.py \
            test_cem_expansion_pilot.py \
            test_cem_expansion_summary.py \
            test_cem_expansion_figures.py \
            test_manuscript.py \
            test_story_figures.py \
            test_precision_story.py \
            test_publication_figures.py \
            test_action_history_figure.py \
            test_action_condition_specificity.py \
            test_action_condition_summary.py \
            test_public_results.py; do
            python -m unittest discover -s tests -p "$test_file" -v
          done
      - name: Run numerical mechanism controls
        run: |
          python -m pytest -q tests/test_controlled_geometry_pilot.py tests/test_controlled_geometry_summary.py tests/test_action_counterfactual_pilot.py tests/test_action_counterfactual_summary.py
