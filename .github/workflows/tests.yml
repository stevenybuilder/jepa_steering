name: Public CPU unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEPA_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/vendor/frozen-study/src/offline_study
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned public crop fixture
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/jepa-wms
          ref: 13cf1d9c7e476f53c17714d2e0f1dc239a883ce0
          path: vendor/jepa-wms
          sparse-checkout: src/datasets/utils/video/transforms.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore source snapshot for historical hash checks
        uses: actions/checkout@v4
        with:
          ref: 40fa529afc782165f5f610e6dac436931e429772
          path: vendor/frozen-study
          sparse-checkout: |
            src/offline_study
            analysis/mechanism
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install '.[analysis,test]'
      - name: Check published result consistency
        run: |
          python scripts/check_public_repository.py
          python scripts/check_public_results.py
          python scripts/check_lcfm_replication.py
      # Integration tests need additional vendor source, private archives or GPUs.
      # Run them explicitly with: python -m pytest tests/integration
      - name: Run public CPU tests
        run: python -m pytest -q tests/unit
