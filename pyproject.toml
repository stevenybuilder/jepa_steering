[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-steering-offline"
version = "0.1.0"
description = "Lineage-aware offline evaluation and throughput measurement for frozen JEPA-WM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.7"]

[project.scripts]
jepa-inventory = "offline_study.inventory:main"
jepa-benchmark = "offline_study.benchmark:main"
jepa-compare-runs = "offline_study.compare:main"
jepa-intervene = "offline_study.intervention_runner:main"
jepa-fit-coupling = "offline_study.operator_fit:main"
jepa-intervention-multigpu = "offline_study.intervention_multigpu:main"
jepa-aggregate-interventions = "offline_study.intervention_multigpu:aggregate_main"
jepa-analyze-development = "offline_study.development_analysis:main"
jepa-multigpu = "offline_study.multigpu:main"

[tool.setuptools.packages.find]
where = ["src"]
